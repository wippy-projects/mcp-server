version: "1.0"
namespace: mcp

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: MCP Server
      description: MCP (Model Context Protocol) server for Wippy — exposes tools to LLM clients over stdio and HTTP

  - name: dependency.terminal
    kind: ns.dependency
    component: wippy/terminal
    version: ">=0.3.0"

  # Terminal host — bridges process to stdin/stdout
  - name: terminal
    kind: terminal.host
    lifecycle:
      auto_start: true

  # --- Shared libraries ---

  - name: jsonrpc
    kind: library.lua
    source: file://jsonrpc.lua
    modules:
      - json

  - name: protocol
    kind: library.lua
    source: file://protocol.lua
    imports:
      jsonrpc: mcp:jsonrpc

  - name: emitter
    kind: library.lua
    source: file://emitter.lua
    modules:
      - events
      - time
      - logger

  - name: tools_lib
    kind: library.lua
    source: file://tools.lua
    modules:
      - registry
      - funcs
      - time
    imports:
      jsonrpc: mcp:jsonrpc

  - name: prompts_lib
    kind: library.lua
    source: file://prompts.lua
    modules:
      - registry
      - funcs
    imports:
      jsonrpc: mcp:jsonrpc

  - name: handler_lib
    kind: library.lua
    source: file://handler.lua
    imports:
      jsonrpc: mcp:jsonrpc
      protocol: mcp:protocol
      tools: mcp:tools_lib
      prompts: mcp:prompts_lib
      emitter: mcp:emitter

  # --- Server process (stdio transport) ---

  - name: server
    kind: process.lua
    source: file://server.lua
    method: main
    modules:
      - io
    imports:
      jsonrpc: mcp:jsonrpc
      handler: mcp:handler_lib
      emitter: mcp:emitter

  # --- HTTP transport (Streamable HTTP) ---

  # Router requirement — host app provides their router
  - name: router
    kind: ns.requirement
    meta:
      description: HTTP router for MCP endpoints
    default: app:api.public
    targets:
      - entry: mcp:sse_endpoint_post
        path: meta.router
      - entry: mcp:sse_endpoint_get
        path: meta.router
      - entry: mcp:sse_endpoint_delete
        path: meta.router

  # HTTP handler function
  - name: sse_handler_fn
    kind: function.lua
    source: file://sse_handler.lua
    method: handler
    modules:
      - http
      - json
      - logger
    imports:
      handler: mcp:handler_lib
      jsonrpc: mcp:jsonrpc
      emitter: mcp:emitter

  # MCP HTTP endpoints (one per method, same path)
  - name: sse_endpoint_post
    kind: http.endpoint
    meta:
      router: app:api.public
    method: POST
    path: /mcp
    func: mcp:sse_handler_fn

  - name: sse_endpoint_get
    kind: http.endpoint
    meta:
      router: app:api.public
    method: GET
    path: /mcp
    func: mcp:sse_handler_fn

  - name: sse_endpoint_delete
    kind: http.endpoint
    meta:
      router: app:api.public
    method: DELETE
    path: /mcp
    func: mcp:sse_handler_fn
